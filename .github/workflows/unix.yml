name: Shell workflows

on:
  push:
  pull_request:

jobs:
  skill-docs:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check skill documentation updates
        env:
          EA_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 tools/check-skill-docs.py "$EA_BASE_SHA" HEAD
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
        python: ['3.9', '3.13']
        include:
          # Ubuntu 26.04 has no Python 3.9 build in actions/setup-python.
          - os: ubuntu-24.04
            python: '3.9'
          - os: ubuntu-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Zsh on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Check shell syntax
        run: git ls-files '*.sh' | while IFS= read -r path; do bash -n "$path" && zsh -n "$path" || exit; done
      - name: Run the workflow tests
        run: python3 -m unittest discover -s tests/unix -v
      - name: Validate distribution archive
        run: |
          bash tools/package-unix.sh "$RUNNER_TEMP/executive-assistant.zip"
          unzip -tq "$RUNNER_TEMP/executive-assistant.zip"
      - name: Run the packaged first-brief workflow
        shell: bash
        run: |
          smoke_dir="$RUNNER_TEMP/Executive Assistant Smoke"
          unzip -q "$RUNNER_TEMP/executive-assistant.zip" -d "$smoke_dir"
          package="$smoke_dir/executive-assistant"
          git show HEAD:LICENSE | cmp - "$package/LICENSE"
          test -f "$package/docs/GETTING-STARTED.md"
          test -f "$package/plugins/executive-assistant/.codex-plugin/plugin.json"
          test ! -e "$package/docs/superpowers/plans"
          test ! -e "$package/docs/superpowers/specs"
          python3 - "$package" "$smoke_dir" <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys
          from urllib.parse import unquote

          package, smoke_dir = map(Path, sys.argv[1:])
          launcher = package / "plugins/executive-assistant/scripts/unix/ea.sh"

          for shell in ("bash", "zsh"):
              vault = smoke_dir / f"{shell} vault"
              codex_home = smoke_dir / f"{shell} settings"
              env = {**os.environ, "CODEX_HOME": str(codex_home)}

              def run(*args):
                  return subprocess.check_output(
                      [shell, "-c", 'exec "$@"', shell, str(launcher), *args],
                      env=env, cwd=package, encoding="utf-8", timeout=30,
                  )

              run("setup", "--vault", str(vault), "--copy-template")
              status = json.loads(run("check"))
              profile = codex_home / "executive-assistant/profiles/default.json"
              assert status["ok"] and profile.is_file(), status
              assert Path(status["profile_path"]).resolve() == profile.resolve(), status
              assert Path(status["vault_path"]).resolve() == vault.resolve(), status

              source = vault / "Action-Items.md"
              with source.open("a", encoding="utf-8") as note:
                  note.write("\n- [ ] Review the meeting agenda\n")
              args = ("report", "daily", "--date", "2026-11-14")
              assert "Review the meeting agenda" in run(*args), shell
              assert not (vault / "_briefings").exists(), shell

              payload = json.loads(run(*args, "--write"))
              report = Path(payload["output_path"])
              assert payload["status"] == "written", payload
              assert report.resolve().is_relative_to(vault.resolve()), report
              contents = report.read_text(encoding="utf-8")
              assert "Review the meeting agenda" in contents, report
              link = re.search(r"\[Action-Items\]\(([^)]+)\)", contents)
              assert link, report
              assert (report.parent / unquote(link[1])).resolve() == source.resolve(), report

              edited = report.read_bytes() + b"\nManual edit to saved brief\n"
              report.write_bytes(edited)
              rerun = json.loads(run(*args, "--write"))
              assert rerun["status"] == "existing", rerun
              assert Path(rerun["output_path"]) == report, rerun
              assert report.read_bytes() == edited, report
              print(f"{shell}: default profile, preview, report link, and preserving rerun verified.")
          PY
